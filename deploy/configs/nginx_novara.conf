server {
    listen 80;
    server_name connectnovara.com www.connectnovara.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name connectnovara.com www.connectnovara.com;

    ssl_certificate /etc/letsencrypt/live/connectnovara.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectnovara.com/privkey.pem;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        root /home/ubuntu/novara/Novara;
    }

    location /media/ {
        root /home/ubuntu/novara/Novara;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/novara/Novara/gunicorn.sock;
    }
}

